<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI Workspace logical architecture</title>
  <desc id="desc">A publication-safe logical view connecting authenticated users, an application load balancer, an ECS and Fargate application, a LibreChat-based workspace, configured agents and integrations, controlled capabilities, RDS PostgreSQL with pgvector, Amazon S3 integration, and an HMAC authorization boundary. It does not depict a complete network topology.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA7B4"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="#11161B"/>
  <text x="64" y="58" fill="#ECE5D7" font-family="General Sans, Arial, sans-serif" font-size="28" font-weight="600">Enterprise AI Workspace</text>
  <text x="64" y="88" fill="#B8A58C" font-family="General Sans, Arial, sans-serif" font-size="15">Logical responsibility boundaries across the workspace, retrieval substrate, integrations, and controlled capabilities</text>

  <g fill="none" stroke="#7FA7B4" stroke-width="2" marker-end="url(#arrow)">
    <path d="M254 225 H300"/>
    <path d="M500 225 H570"/>
    <path d="M880 225 H960"/>
    <path d="M1220 225 H1270"/>
    <path d="M400 280 V450"/>
    <path d="M725 305 V450"/>
    <path d="M820 305 C910 350 1000 390 1080 450"/>
    <path d="M1090 280 V410"/>
  </g>

  <g font-family="General Sans, Arial, sans-serif">
    <g>
      <rect x="64" y="165" width="190" height="120" rx="8" fill="#272A2A" stroke="#B8A58C"/>
      <text x="84" y="195" fill="#B8A58C" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">01 / ACCESS</text>
      <text x="84" y="232" fill="#ECE5D7" font-size="17" font-weight="600">Users</text>
      <text x="84" y="256" fill="#ECE5D7" font-size="17" font-weight="600">authenticated access</text>
    </g>
    <g>
      <rect x="300" y="165" width="200" height="120" rx="8" fill="#272A2A" stroke="#B8A58C"/>
      <text x="320" y="195" fill="#B8A58C" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">02 / ENTRY</text>
      <text x="320" y="232" fill="#ECE5D7" font-size="17" font-weight="600">Application</text>
      <text x="320" y="256" fill="#ECE5D7" font-size="17" font-weight="600">Load Balancer</text>
    </g>
    <g>
      <rect x="570" y="135" width="310" height="170" rx="8" fill="#182A31" stroke="#7FA7B4"/>
      <text x="594" y="168" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">03 / APPLICATION</text>
      <text x="594" y="210" fill="#ECE5D7" font-size="21" font-weight="600">LibreChat-based</text>
      <text x="594" y="238" fill="#ECE5D7" font-size="21" font-weight="600">AI workspace</text>
      <text x="594" y="273" fill="#B8A58C" font-size="13">Customized and extended application surface</text>
    </g>
    <g>
      <rect x="960" y="165" width="260" height="120" rx="8" fill="#182A31" stroke="#7FA7B4"/>
      <text x="980" y="195" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">04 / INTEGRATION</text>
      <text x="980" y="232" fill="#ECE5D7" font-size="17" font-weight="600">Configured agents</text>
      <text x="980" y="256" fill="#ECE5D7" font-size="17" font-weight="600">and integrations</text>
    </g>
    <g>
      <rect x="1270" y="165" width="260" height="120" rx="8" fill="#2B211D" stroke="#D67B56"/>
      <text x="1290" y="195" fill="#D67B56" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">05 / BOUNDED</text>
      <text x="1290" y="232" fill="#ECE5D7" font-size="17" font-weight="600">Controlled</text>
      <text x="1290" y="256" fill="#ECE5D7" font-size="17" font-weight="600">capabilities</text>
    </g>
  </g>

  <rect x="280" y="375" width="1000" height="255" rx="12" fill="none" stroke="#B8A58C" stroke-opacity="0.45" stroke-dasharray="8 8"/>
  <text x="312" y="410" fill="#B8A58C" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">AWS APPLICATION SURFACE · PUBLICATION-SAFE ABSTRACTION</text>

  <g font-family="General Sans, Arial, sans-serif">
    <g>
      <rect x="300" y="450" width="250" height="120" rx="8" fill="#182A31" stroke="#7FA7B4"/>
      <text x="324" y="482" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">HOSTING</text>
      <text x="324" y="522" fill="#ECE5D7" font-size="18" font-weight="600">ECS / Fargate</text>
      <text x="324" y="548" fill="#B8A58C" font-size="13">Application runtime</text>
    </g>
    <g>
      <rect x="620" y="450" width="280" height="120" rx="8" fill="#263A39" stroke="#7FA7B4"/>
      <text x="644" y="482" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">PERSISTENCE</text>
      <text x="644" y="522" fill="#ECE5D7" font-size="18" font-weight="600">RDS PostgreSQL</text>
      <text x="644" y="548" fill="#B8A58C" font-size="13">pgvector retrieval substrate</text>
    </g>
    <g>
      <rect x="960" y="450" width="240" height="120" rx="8" fill="#263A39" stroke="#7FA7B4"/>
      <text x="984" y="482" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">CONTENT</text>
      <text x="984" y="522" fill="#ECE5D7" font-size="18" font-weight="600">Amazon S3</text>
      <text x="984" y="548" fill="#B8A58C" font-size="13">Object storage integration</text>
    </g>
    <g>
      <rect x="1260" y="420" width="260" height="150" rx="8" fill="#2B211D" stroke="#D67B56"/>
      <text x="1284" y="452" fill="#D67B56" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">AUTHORIZATION</text>
      <text x="1284" y="492" fill="#ECE5D7" font-size="18" font-weight="600">HMAC boundary</text>
      <text x="1284" y="523" fill="#B8A58C" font-size="13">Integration request control</text>
      <text x="1284" y="546" fill="#B8A58C" font-size="13">Exact policy details omitted</text>
    </g>
  </g>

  <text x="64" y="678" fill="#B8A58C" font-family="Consolas, monospace" font-size="11">Logical relationships only — not a complete network topology, IAM policy, monitoring map, or production guarantee.</text>
</svg>
