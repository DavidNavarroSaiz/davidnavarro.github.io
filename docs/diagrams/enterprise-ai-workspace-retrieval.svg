<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI Workspace retrieval and persistence flow</title>
  <desc id="desc">A publication-safe retrieval flow from approved content and an Amazon S3 integration through retrieval preparation, RDS PostgreSQL with pgvector, context retrieval, and a configured workspace agent. Exact ingestion and indexing details are intentionally not disclosed.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA7B4"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="#11161B"/>
  <text x="64" y="58" fill="#ECE5D7" font-family="General Sans, Arial, sans-serif" font-size="28" font-weight="600">Retrieval and persistence flow</text>
  <text x="64" y="88" fill="#B8A58C" font-family="General Sans, Arial, sans-serif" font-size="15">A bounded view of content, vector persistence, and context retrieval</text>

  <g fill="none" stroke="#7FA7B4" stroke-width="2" marker-end="url(#arrow)">
    <path d="M304 270 H368"/>
    <path d="M648 270 H724"/>
    <path d="M1024 270 H1100"/>
    <path d="M1300 270 H1364"/>
  </g>

  <g font-family="General Sans, Arial, sans-serif">
    <g>
      <rect x="64" y="190" width="240" height="160" rx="8" fill="#272A2A" stroke="#B8A58C"/>
      <text x="88" y="224" fill="#B8A58C" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">01 / SOURCE</text>
      <text x="88" y="266" fill="#ECE5D7" font-size="19" font-weight="600">Approved content</text>
      <text x="88" y="296" fill="#ECE5D7" font-size="19" font-weight="600">S3 integration</text>
      <text x="88" y="327" fill="#B8A58C" font-size="13">Object storage boundary</text>
    </g>
    <g>
      <rect x="368" y="190" width="280" height="160" rx="8" fill="#182A31" stroke="#7FA7B4"/>
      <text x="392" y="224" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">02 / PREPARE</text>
      <text x="392" y="266" fill="#ECE5D7" font-size="19" font-weight="600">Retrieval</text>
      <text x="392" y="296" fill="#ECE5D7" font-size="19" font-weight="600">preparation</text>
      <text x="392" y="327" fill="#B8A58C" font-size="13">Implementation details withheld</text>
    </g>
    <g>
      <rect x="724" y="190" width="300" height="160" rx="8" fill="#263A39" stroke="#7FA7B4"/>
      <text x="748" y="224" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">03 / PERSIST</text>
      <text x="748" y="266" fill="#ECE5D7" font-size="19" font-weight="600">RDS PostgreSQL</text>
      <text x="748" y="296" fill="#ECE5D7" font-size="19" font-weight="600">+ pgvector</text>
      <text x="748" y="327" fill="#B8A58C" font-size="13">Vector retrieval substrate</text>
    </g>
    <g>
      <rect x="1100" y="190" width="200" height="160" rx="8" fill="#182A31" stroke="#7FA7B4"/>
      <text x="1124" y="224" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">04 / RETRIEVE</text>
      <text x="1124" y="266" fill="#ECE5D7" font-size="19" font-weight="600">Context</text>
      <text x="1124" y="296" fill="#ECE5D7" font-size="19" font-weight="600">retrieval</text>
      <text x="1124" y="327" fill="#B8A58C" font-size="13">Relevant context boundary</text>
    </g>
    <g>
      <rect x="1364" y="190" width="172" height="160" rx="8" fill="#2B211D" stroke="#D67B56"/>
      <text x="1388" y="224" fill="#D67B56" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">05 / USE</text>
      <text x="1388" y="266" fill="#ECE5D7" font-size="19" font-weight="600">Workspace</text>
      <text x="1388" y="296" fill="#ECE5D7" font-size="19" font-weight="600">agent</text>
      <text x="1388" y="327" fill="#B8A58C" font-size="13">Configured capability</text>
    </g>
  </g>

  <rect x="368" y="410" width="932" height="64" rx="8" fill="#272A2A" stroke="#B8A58C" stroke-opacity="0.65"/>
  <text x="400" y="449" fill="#B8A58C" font-family="Consolas, monospace" font-size="12">Publication boundary: no private documents, schemas, chunking rules, index settings, retry behavior, or performance metrics are disclosed.</text>
</svg>
