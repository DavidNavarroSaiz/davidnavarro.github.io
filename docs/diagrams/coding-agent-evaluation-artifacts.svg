<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Run-artifact and validation structure</title>
  <desc id="desc">A run evidence bundle branches to experiment metadata, execution trace, generated changes, deterministic checks, security review, and assessment inputs. Deterministic checks contain functional and code-quality checks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/>
    </marker>
  </defs>
  <rect width="1400" height="860" fill="#070B12"/>
  <text x="70" y="58" fill="#F1F5F9" font-family="General Sans, Arial, sans-serif" font-size="25" font-weight="600">Run-artifact and validation structure</text>
  <text x="70" y="88" fill="#AEBCCD" font-family="General Sans, Arial, sans-serif" font-size="15">Evidence is grouped by configuration, execution, verification, and review</text>

  <rect x="470" y="126" width="460" height="88" rx="8" fill="#0D2030" stroke="#22D3EE" stroke-width="2"/>
  <text x="510" y="163" fill="#67E8F9" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">RUN ROOT</text>
  <text x="510" y="194" fill="#F1F5F9" font-family="General Sans, Arial, sans-serif" font-size="22" font-weight="600">Run evidence bundle</text>

  <g fill="none" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrow)">
    <path d="M700 214 V260 H190 V300"/>
    <path d="M700 214 V260 H430 V300"/>
    <path d="M700 214 V260 H670 V300"/>
    <path d="M700 214 V260 H930 V300"/>
    <path d="M700 214 V260 H1170 V300"/>
    <path d="M700 214 V260 H1280 V410"/>
    <path d="M930 390 V456 H810 V496"/>
    <path d="M930 390 V456 H1050 V496"/>
  </g>

  <g font-family="General Sans, Arial, sans-serif">
    <g>
      <rect x="70" y="300" width="240" height="90" rx="8" fill="#0D141E" stroke="#8B9BB0"/>
      <text x="94" y="336" fill="#F1F5F9" font-size="16" font-weight="600">Experiment metadata</text>
      <text x="94" y="362" fill="#AEBCCD" font-size="13">configuration and task version</text>
    </g>
    <g>
      <rect x="310" y="300" width="240" height="90" rx="8" fill="#0D141E" stroke="#8B9BB0"/>
      <text x="334" y="336" fill="#F1F5F9" font-size="16" font-weight="600">Execution trace</text>
      <text x="334" y="362" fill="#AEBCCD" font-size="13">logs and transcript</text>
    </g>
    <g>
      <rect x="550" y="300" width="240" height="90" rx="8" fill="#0D141E" stroke="#8B9BB0"/>
      <text x="574" y="336" fill="#F1F5F9" font-size="16" font-weight="600">Generated changes</text>
      <text x="574" y="362" fill="#AEBCCD" font-size="13">code diff and test results</text>
    </g>
    <g>
      <rect x="810" y="300" width="240" height="90" rx="8" fill="#0B2B2B" stroke="#2DD4BF"/>
      <text x="834" y="336" fill="#F1F5F9" font-size="16" font-weight="600">Deterministic checks</text>
      <text x="834" y="362" fill="#2DD4BF" font-size="13">automated validation</text>
    </g>
    <g>
      <rect x="1070" y="300" width="240" height="90" rx="8" fill="#231F18" stroke="#F4D38A"/>
      <text x="1094" y="336" fill="#F1F5F9" font-size="16" font-weight="600">Security review</text>
      <text x="1094" y="362" fill="#F4D38A" font-size="13">security and authorization</text>
    </g>
    <g>
      <rect x="1190" y="410" width="180" height="90" rx="8" fill="#231F18" stroke="#F4D38A"/>
      <text x="1214" y="446" fill="#F1F5F9" font-size="16" font-weight="600">Assessment</text>
      <text x="1214" y="472" fill="#F4D38A" font-size="13">human / advisory</text>
    </g>

    <g>
      <rect x="690" y="496" width="240" height="90" rx="8" fill="#0B2B2B" stroke="#2DD4BF"/>
      <text x="714" y="532" fill="#F1F5F9" font-size="16" font-weight="600">Functional checks</text>
      <text x="714" y="558" fill="#AEBCCD" font-size="13">repeatable behavior signal</text>
    </g>
    <g>
      <rect x="950" y="496" width="240" height="90" rx="8" fill="#0B2B2B" stroke="#2DD4BF"/>
      <text x="974" y="532" fill="#F1F5F9" font-size="16" font-weight="600">Code-quality checks</text>
      <text x="974" y="558" fill="#AEBCCD" font-size="13">repeatable quality signal</text>
    </g>
  </g>

  <text x="70" y="680" fill="#8B9BB0" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">REVIEW BOUNDARY</text>
  <text x="70" y="712" fill="#AEBCCD" font-family="General Sans, Arial, sans-serif" font-size="15">Model-assisted assessment may be used where applicable; private schemas, scores, and internal experiment artifacts remain undisclosed.</text>
  <g font-family="Consolas, monospace" font-size="11">
    <circle cx="70" cy="778" r="5" fill="#8B9BB0"/><text x="84" y="782" fill="#AEBCCD">captured evidence</text>
    <circle cx="264" cy="778" r="5" fill="#2DD4BF"/><text x="278" y="782" fill="#AEBCCD">automated checks</text>
    <circle cx="466" cy="778" r="5" fill="#F4D38A"/><text x="480" y="782" fill="#AEBCCD">manual / assisted review</text>
  </g>
</svg>
