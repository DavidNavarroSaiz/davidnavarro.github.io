<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">Secure AI code execution and workspace isolation</title>
  <desc id="desc">A publication-safe execution path from authenticated request through an execution gateway, session and mount validation, managed interpreter, owner-scoped persistent workspace, and verified artifacts. Unexpected state fails closed, while a shared execution role remains a residual hostile-tenant risk.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA7B4"/>
    </marker>
    <marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D67B56"/>
    </marker>
  </defs>
  <rect width="1600" height="540" fill="#11161B"/>
  <text x="64" y="54" fill="#ECE5D7" font-family="General Sans, Arial, sans-serif" font-size="25" font-weight="600">Secure AI code execution and workspace isolation</text>
  <text x="64" y="84" fill="#B8A58C" font-family="General Sans, Arial, sans-serif" font-size="15">Identity-derived ownership, verified runtime state, bounded storage, and explicit denial paths</text>

  <g fill="none" stroke="#7FA7B4" stroke-width="2" marker-end="url(#arrow)">
    <path d="M244 190 H274"/>
    <path d="M484 190 H514"/>
    <path d="M724 190 H754"/>
    <path d="M964 190 H994"/>
  </g>
  <g font-family="General Sans, Arial, sans-serif">
    <g>
      <rect x="64" y="132" width="180" height="116" rx="8" fill="#272A2A" stroke="#B8A58C"/>
      <text x="84" y="163" fill="#B8A58C" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">01 / IDENTITY</text>
      <text x="84" y="198" fill="#ECE5D7" font-size="17" font-weight="600">Authenticated</text>
      <text x="84" y="220" fill="#ECE5D7" font-size="17" font-weight="600">request</text>
    </g>
    <g>
      <rect x="274" y="132" width="210" height="116" rx="8" fill="#182A31" stroke="#7FA7B4"/>
      <text x="294" y="163" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">02 / GATEWAY</text>
      <text x="294" y="198" fill="#ECE5D7" font-size="17" font-weight="600">Derive owner</text>
      <text x="294" y="220" fill="#ECE5D7" font-size="17" font-weight="600">server-side</text>
    </g>
    <g>
      <rect x="514" y="132" width="210" height="116" rx="8" fill="#2B211D" stroke="#D67B56"/>
      <text x="534" y="163" fill="#D67B56" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">03 / VERIFY</text>
      <text x="534" y="198" fill="#ECE5D7" font-size="17" font-weight="600">Session and</text>
      <text x="534" y="220" fill="#ECE5D7" font-size="17" font-weight="600">mount checks</text>
    </g>
    <g>
      <rect x="754" y="132" width="210" height="116" rx="8" fill="#182A31" stroke="#7FA7B4"/>
      <text x="774" y="163" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">04 / RUNTIME</text>
      <text x="774" y="198" fill="#ECE5D7" font-size="17" font-weight="600">Managed</text>
      <text x="774" y="220" fill="#ECE5D7" font-size="17" font-weight="600">interpreter</text>
    </g>
    <g>
      <rect x="994" y="132" width="210" height="116" rx="8" fill="#263A39" stroke="#7FA7B4"/>
      <text x="1014" y="163" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">05 / STORAGE</text>
      <text x="1014" y="198" fill="#ECE5D7" font-size="17" font-weight="600">Owner-scoped</text>
      <text x="1014" y="220" fill="#ECE5D7" font-size="17" font-weight="600">persistent workspace</text>
    </g>
    <g>
      <rect x="1234" y="132" width="210" height="116" rx="8" fill="#263A39" stroke="#7FA7B4"/>
      <text x="1254" y="163" fill="#7FA7B4" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">06 / OUTPUT</text>
      <text x="1254" y="198" fill="#ECE5D7" font-size="17" font-weight="600">Verified files</text>
      <text x="1254" y="220" fill="#ECE5D7" font-size="17" font-weight="600">and artifacts</text>
    </g>
  </g>

  <path d="M619 248 V326 H456" fill="none" stroke="#D67B56" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-risk)"/>
  <g>
    <rect x="236" y="300" width="220" height="86" rx="8" fill="#2B211D" stroke="#D67B56"/>
    <text x="256" y="331" fill="#D67B56" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">DENY</text>
    <text x="256" y="358" fill="#ECE5D7" font-family="General Sans, Arial, sans-serif" font-size="17" font-weight="600">Fail closed</text>
    <text x="256" y="378" fill="#D67B56" font-family="General Sans, Arial, sans-serif" font-size="12">unexpected state or mount</text>
  </g>

  <path d="M859 248 V430 H1078" fill="none" stroke="#D67B56" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-risk)"/>
  <g>
    <rect x="1078" y="386" width="430" height="94" rx="8" fill="#35221D" stroke="#D67B56"/>
    <text x="1100" y="416" fill="#D67B56" font-family="Consolas, monospace" font-size="11" letter-spacing="1.4">RESIDUAL SECURITY RISK</text>
    <text x="1100" y="444" fill="#FFD8C7" font-family="General Sans, Arial, sans-serif" font-size="16" font-weight="600">Shared interpreter resource and execution role</text>
    <text x="1100" y="465" fill="#D67B56" font-family="General Sans, Arial, sans-serif" font-size="12">not a strong boundary against mutually hostile credential abuse</text>
  </g>
  <text x="64" y="482" fill="#6F7E86" font-family="General Sans, Arial, sans-serif" font-size="13">Application-level ownership and mount checks reduce accidental cross-owner routing; they do not establish unrestricted secure execution.</text>
</svg>
